name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "base/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: workspace packages resolve each other through their
      # published `dist/` entry points, which are gitignored. Typechecking or
      # testing a fresh checkout before building leaves every cross-package
      # import unresolvable.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply D1 migration locally
        run: pnpm run cloudflare:migrate:local

      - name: Verify local credited seed import and idempotent rerun
        run: pnpm run demo:seed:local

      - name: Check generated docs
        run: pnpm --filter @vector-image-detection/docs run check

      - name: Test
        run: pnpm test

      - name: Verify hosted production output
        run: pnpm run test:output

      - name: Install Playwright Chromium
        run: pnpm --filter @vector-image-detection/demo exec playwright install --with-deps chromium

      - name: Exercise production browser flows
        run: pnpm run test:e2e:mocked

      - name: Exercise auth gate against the real Worker
        run: pnpm run test:e2e:worker

      - name: Assert deployable static assets
        run: pnpm run cloudflare:assets

      - name: Dry-run Cloudflare delivery
        run: pnpm run cloudflare:dry-run
